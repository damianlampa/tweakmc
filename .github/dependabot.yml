version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      react-runtime:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      vite-and-react-plugin:
        patterns: ['vite', '@vitejs/plugin-react']
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/vite']
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Warsaw
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
